server:
  port: 8080

spring:
  application:
    name: smart-salon-backend
  threads:
    virtual:
      enabled: true # Kích hoạt Java 25 Virtual Threads cho bài toán Concurrency

  datasource:
    url: jdbc:mysql://localhost:3306/smart_salon_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Ho_Chi_Minh
    username: salon_user
    password: salon_password_2026
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: validate # Để Flyway quản lý hoàn toàn Schema
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

  data:
    redis:
      host: localhost
      port: 6379
      timeout: 5000ms

app:
  jwt:
    secret: "404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970"
    access-expiration-ms: 3600000 # 1 giờ
    refresh-expiration-ms: 604800000 # 7 ngày
  cors:
    allowed-origins: "http://localhost:5173"
  payos:
    client-id: ${PAYOS_CLIENT_ID:}
    api-key: ${PAYOS_API_KEY:}
    checksum-key: ${PAYOS_CHECKSUM_KEY:}
    bank-id: ${PAYOS_BANK_ID:MB}
    account-no: ${PAYOS_ACCOUNT_NO:0988888888}
    account-name: ${PAYOS_ACCOUNT_NAME:SMART SALON VIETNAM}
    return-url: ${PAYOS_RETURN_URL:http://localhost:5173/customer/booking?step=4}
    cancel-url: ${PAYOS_CANCEL_URL:http://localhost:5173/customer/booking?step=4}
    simulation-enabled: ${PAYOS_SIMULATION_ENABLED:false}
  cloudinary:
    cloud-name: ${CLOUDINARY_CLOUD_NAME:}
    api-key: ${CLOUDINARY_API_KEY:}
    api-secret: ${CLOUDINARY_API_SECRET:}
  upload:
    local-dir: ${UPLOAD_LOCAL_DIR:uploads/visual-logs}
