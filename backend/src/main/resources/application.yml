server:
  port: 8080

spring:
  application:
    name: smart-salon-backend
  threads:
    virtual:
      enabled: true # Kích hoạt Java 25 Virtual Threads cho bài toán Concurrency

  datasource:
    url: jdbc:mysql://localhost:3306/smart_salon_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Ho_Chi_Minh
    username: salon_user
    password: salon_password_2026
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: validate # Để Flyway quản lý hoàn toàn Schema
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

  data:
    redis:
      host: localhost
      port: 6379
      timeout: 5000ms

app:
  jwt:
    secret: "404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970"
    access-expiration-ms: 3600000 # 1 giờ
    refresh-expiration-ms: 604800000 # 7 ngày
  cors:
    allowed-origins: "http://localhost:5173"
